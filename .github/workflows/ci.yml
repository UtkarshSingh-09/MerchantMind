name: Production CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================
  # 1. Backend: Code Quality & Linting
  # =========================================================
  backend-lint:
    name: Backend Lint (Ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Ruff
        run: pip install ruff==0.8.6

      - name: Run Ruff Lint Checks
        run: ruff check .

  # =========================================================
  # 2. Backend: 111-Test Automated Suite (PostgreSQL + Redis)
  # =========================================================
  backend-test:
    name: Backend Test Suite (111 Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: merchantmind
          POSTGRES_PASSWORD: merchantmind_test
          POSTGRES_DB: merchantmind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Full 111-Test Suite
        env:
          DATABASE_URL: postgresql+asyncpg://merchantmind:merchantmind_test@localhost:5432/merchantmind_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci_production_hardening_test_secret_key_12345
          RAZORPAY_KEY_ID: rzp_test_ci_dummy
          RAZORPAY_KEY_SECRET: rzp_secret_ci_dummy
          RAZORPAY_WEBHOOK_SECRET: rzp_webhook_secret_ci_dummy
          GROQ_API_KEY: gsk_ci_dummy_token_for_mocked_tests
          APP_ENV: testing
          PYTHONPATH: .
        run: pytest tests/ -v

  # =========================================================
  # 3. Frontend: Linting & Next.js Production Build
  # =========================================================
  frontend-build:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build Production Next.js Bundle
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_SOCKET_URL: http://localhost:8000
        run: npm run build

  # =========================================================
  # 4. Containerization: Docker Compose Build Verification
  # =========================================================
  docker-build:
    name: Container Build Verification
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-test, frontend-build]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Stack
        run: docker compose build
